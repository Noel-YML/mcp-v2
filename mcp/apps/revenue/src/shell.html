<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Revenue performance</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #111318;
    --muted: #5b6270;
    --border: #d8dce3;
    --positive: #0a7d33;
    --negative: #b3261e;
    --warn-bg: #fff6e5;
    --warn-fg: #7a5200;
  }
  html[data-theme="dark"] {
    --bg: #14161b;
    --fg: #eceef2;
    --muted: #a6adba;
    --border: #333844;
    --positive: #4ade80;
    --negative: #f87171;
    --warn-bg: #3a2f12;
    --warn-fg: #ffd58a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body { padding: 12px 14px; }
  #card:focus-within { outline: none; }
  .card-heading { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
  .card-subheading { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
  .quality-warning {
    background: var(--warn-bg);
    color: var(--warn-fg);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    margin-bottom: 10px;
  }
  .empty-state { color: var(--muted); font-size: 13px; padding: 8px 0; }
  table.metric-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .metric-table th {
    text-align: right;
    font-weight: 600;
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    border-bottom: 1px solid var(--border);
    padding: 6px 8px;
  }
  .metric-table th:first-child, .metric-table td.metric-label { text-align: left; }
  .metric-table td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  .variance-positive { color: var(--positive); }
  .variance-negative { color: var(--negative); }
  .stream-chart { margin-top: 14px; }
  .stream-chart-title { font-size: 12px; font-weight: 600; margin: 0 0 2px; text-transform: uppercase; letter-spacing: 0.02em; color: var(--muted); }
  .stream-chart-subtitle { font-size: 11px; color: var(--muted); margin: 0 0 8px; }
  .stream-bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; }
  .stream-bar-label { flex: 0 0 44px; color: var(--fg); }
  .stream-bar-track { flex: 1 1 auto; min-width: 0; height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .stream-bar-fill { height: 100%; background: #2f6feb; border-radius: 5px; }
  .stream-bar-fill.stream-bar-negative { background: var(--negative); }
  .stream-bar-value { flex: 0 0 auto; min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; color: var(--fg); }
  a, button, [tabindex] { }
  :focus-visible { outline: 2px solid #2f6feb; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div id="card" role="region" aria-label="Revenue performance" tabindex="-1">Loading…</div>
<script>__VIEW_BUNDLE__</script>
</body>
</html>
