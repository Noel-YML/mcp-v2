<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARIEL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="backdrop"></div>

<div class="shell">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-inner">
      <button class="nav-item nav-btn" id="newChatBtn" title="New chat">
        <span class="icon-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 5v14M5 12h14"/></svg>
        </span>
        <span class="nav-label">New chat</span>
      </button>
      <button class="nav-item nav-btn" id="switchHotelBtn" title="Switch hotel">
        <span class="icon-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        </span>
        <span class="nav-label">Switch hotel</span>
      </button>

      <div class="sidebar-history">
        <div class="sidebar-history-label">History</div>
        <label class="sidebar-archived-toggle">
          <input type="checkbox" id="showArchivedToggle">
          Show archived
        </label>
        <div class="history-list" id="historyList"></div>
      </div>

      <div class="nav-item">
        <div class="avatar" id="hotelAvatar">?</div>
        <span class="nav-label" id="hotelNameLabel">Not identified</span>
      </div>
    </div>
  </aside>

  <main class="panel">

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">A</span>
        <span class="brand-word">ARIEL</span>
      </div>
    </header>

    <div class="chat-area" id="chatArea">

      <div class="empty-state" id="emptyState">
        <div class="greeting">
          Hi, I'm <span class="greeting-accent">ARIEL</span>.<br>
          <span class="greeting-sub">your automation intelligence teammate.</span>
        </div>
        <div class="greeting-prompt">What should we work on today?</div>
      </div>

      <div class="transcript" id="transcript"></div>

    </div>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="messageInput" placeholder="Ask ARIEL about automation metrics, trends, or a specific hotel&hellip;" rows="1"></textarea>
        <button class="send-btn" id="sendBtn" title="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <div class="chips" id="chips">
        <button class="chip" data-prompt="What's our revenue trend for the last 7 days?">Revenue trend (7 days)</button>
        <button class="chip" data-prompt="What's our current market segment mix?">Segment mix</button>
        <button class="chip" data-prompt="How is F&amp;B performing right now?">F&amp;B performance</button>
        <button class="chip" data-prompt="What's our holdings outlook for the next 7 days?">Holdings outlook</button>
      </div>
      <div class="disclaimer">AI can make mistakes. Please verify important information.</div>
    </div>

  </main>
</div>

<div class="identify-overlay" id="identifyOverlay">
  <div class="identify-card">
    <div class="identify-mark">A</div>
    <div class="identify-title">Hotel Access</div>
    <div class="identify-sub">Enter your hotel code to continue. This identifies which hotel you'll see &mdash; it isn't a password.</div>
    <input type="text" id="hotelCodeInput" class="identify-input" placeholder="Hotel code, e.g. H1757" autocomplete="off">
    <button class="identify-btn" id="identifySubmitBtn">Continue</button>
    <div class="identify-error" id="identifyError"></div>
  </div>
</div>

<template id="tpl-history-item">
  <div class="history-item">
    <button class="history-item-main">
      <div class="history-item-title"></div>
      <div class="history-item-time"></div>
    </button>
    <div class="history-item-actions">
      <button class="history-action rename-btn" title="Rename">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
      </button>
      <button class="history-action archive-btn" title="Archive">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8M10 13h4"/></svg>
      </button>
      <button class="history-action delete-btn" title="Delete">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-9 0 1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/></svg>
      </button>
    </div>
  </div>
</template>

<template id="tpl-user">
  <div class="msg msg-user"><div class="bubble"></div></div>
</template>

<template id="tpl-agent">
  <div class="msg msg-agent">
    <div class="ai-panel">
      <div class="ai-badge"><span class="ai-dot"></span><span class="ai-badge-text">ARIEL</span></div>
      <div class="ai-body"></div>
      <div class="ai-presentation"></div>
      <div class="ai-insights-slot"></div>
      <div class="ai-actions-slot"></div>
    </div>
  </div>
</template>

<template id="tpl-loading">
  <div class="msg msg-agent">
    <div class="ai-panel">
      <div class="ai-badge"><span class="ai-dot"></span><span class="ai-badge-text">ARIEL is thinking&hellip;</span></div>
    </div>
  </div>
</template>

<template id="tpl-error">
  <div class="msg msg-agent">
    <div class="ai-panel ai-panel-error">
      <div class="ai-badge"><span class="ai-badge-text">Error</span></div>
      <div class="ai-body"></div>
    </div>
  </div>
</template>

<script src="{{ url_for('static', filename='vendor/echarts.min.js') }}"></script>
<script src="{{ url_for('static', filename='presentation.js') }}"></script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
